name: "Update request"
description: "A package is behind upstream."
title: "Update: PACKAGENAME OLDVERSION → NEWVERSION"
labels: ["0. request"]
body:
  - type: "input"
    id: "pkg-name"
    attributes:
      label: "Package"
      description: "Which one?"
    validations:
      required: true
  - type: "input"
    id: "version"
    attributes:
      label: "Target version"
      description: "The version you'd like it updated to."
    validations:
      required: true
  - type: "input"
    id: "changelog"
    attributes:
      label: "Changelog"
      description: "Link, if one exists."
    validations:
      required: false
  - type: "textarea"
    id: "additional-context"
    attributes:
      label: "Anything else"
    validations:
      required: false
