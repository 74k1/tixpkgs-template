name: "Package request"
description: "Something's missing from nixpkgs and you want it here."
title: "Package Request: PACKAGENAME"
labels: ["0. request"]
body:
  - type: "input"
    id: "pkg-name"
    attributes:
      label: "Package"
      description: "Name of the software."
    validations:
      required: true
  - type: "input"
    id: "source"
    attributes:
      label: "Source"
      description: "Link to the repo or project page."
    validations:
      required: true
  - type: "textarea"
    id: "context"
    attributes:
      label: "Why here and not nixpkgs or nix-community?"
      description: "Just out of curiosity."
    validations:
      required: false
  - type: "textarea"
    id: "additional-context"
    attributes:
      label: "Anything else"
    validations:
      required: false
